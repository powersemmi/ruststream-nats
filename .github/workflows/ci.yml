name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, msrv]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: ruststream-nats

      - uses: actions/checkout@v4
        with:
          repository: powersemmi/ruststream
          persist-credentials: false
          path: ruststream

      # The MSRV leg follows `rust-version` in Cargo.toml, so an MSRV bump is a one-line change.
      - name: Resolve toolchain
        id: toolchain
        working-directory: ruststream-nats
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          if [ "$TOOLCHAIN" = "msrv" ]; then
            TOOLCHAIN="$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)"
            test -n "$TOOLCHAIN"
          fi
          echo "toolchain=$TOOLCHAIN" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ruststream-nats

      - name: cargo fmt
        if: matrix.toolchain == 'stable'
        working-directory: ruststream-nats
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: matrix.toolchain == 'stable'
        working-directory: ruststream-nats
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo check (no default features)
        working-directory: ruststream-nats
        run: cargo check --workspace --no-default-features

      - name: cargo check (all features)
        working-directory: ruststream-nats
        run: cargo check --workspace --all-targets --all-features

      - name: cargo test (handler-stub only, no live broker)
        working-directory: ruststream-nats
        run: cargo test --workspace --all-features

  templates:
    name: Templates (render + compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: ruststream-nats

      # The rendered scaffolds pin `ruststream` and `ruststream-nats` by version; until 0.5 is
      # published the sibling checkout supplies the unpublished crate through the injected patch.
      - uses: actions/checkout@v4
        with:
          repository: powersemmi/ruststream
          persist-credentials: false
          path: ruststream

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ruststream-nats

      - name: Install cargo-generate
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-generate

      # Template-contract drift check: render each scaffold and compile it, so a broker API change
      # that breaks a template fails here, not a user's first `cargo build`. The rendered projects
      # pin both crates by version; until 0.5 is published, patch each to the sibling checkout so the
      # scaffold builds against the local crates.
      - name: Render and check templates
        working-directory: ruststream-nats
        env:
          RUSTSTREAM_PATH: ${{ github.workspace }}/ruststream
          NATS_PATH: ${{ github.workspace }}/ruststream-nats/crates/ruststream-nats
        run: |
          for tpl in nats nats-js; do
            name="smoke-$tpl"
            cargo generate --path "templates/$tpl" --name "$name" --destination "$RUNNER_TEMP" --vcs none
            {
              echo ""
              echo "[patch.crates-io]"
              echo "ruststream = { path = \"$RUSTSTREAM_PATH\" }"
              echo "ruststream-nats = { path = \"$NATS_PATH\" }"
            } >> "$RUNNER_TEMP/$name/Cargo.toml"
            cargo check --manifest-path "$RUNNER_TEMP/$name/Cargo.toml"
          done

  broker-integration:
    name: Broker integration (NATS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: ruststream-nats

      - uses: actions/checkout@v4
        with:
          repository: powersemmi/ruststream
          persist-credentials: false
          path: ruststream

      - name: Start NATS with JetStream
        run: |
          docker run -d --name nats \
            -p 127.0.0.1:4222:4222 \
            -p 127.0.0.1:8222:8222 \
            nats:2-alpine -js -m 8222

      - name: Wait for NATS + JetStream
        timeout-minutes: 1
        run: |
          timeout 30 bash -c 'until docker logs nats 2>&1 | grep -q "Server is ready"; do sleep 0.5; done'
          docker logs nats

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ruststream-nats

      - name: Run NATS integration tests
        working-directory: ruststream-nats
        env:
          NATS_TEST_URL: nats://127.0.0.1:4222
        run: >-
          cargo test -p ruststream-nats
          --test integration_nats
          --test integration_nats_batch
          -- --test-threads=1

      - name: Run NATS conformance suite
        working-directory: ruststream-nats
        env:
          NATS_TEST_URL: nats://127.0.0.1:4222
        run: cargo test -p ruststream-nats --features testing --test conformance_nats -- --test-threads=1

      - name: Cleanup
        if: always()
        run: docker rm -f nats

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: ruststream-nats

      # cargo-deny resolves the whole dependency graph, so the cross-repo `ruststream`
      # path dependency must be present. Mirror the rust job's sibling layout and run the
      # tool natively (the Docker action only mounts this workspace, not the sibling).
      - uses: actions/checkout@v4
        with:
          repository: powersemmi/ruststream
          persist-credentials: false
          path: ruststream

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # Dependency-graph gate: RustSec advisories, license allow-list, duplicate
      # versions, and registry sources, per the checked-in deny.toml. Not path-
      # gated: advisories arrive over time, not only with manifest changes.
      - name: cargo deny
        working-directory: ruststream-nats
        run: cargo deny check

      # No cache: there is no uv.lock anymore (uvx resolves the tools on the fly).
      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: codespell
        working-directory: ruststream-nats
        run: uvx codespell

      - name: zizmor
        working-directory: ruststream-nats
        run: uvx zizmor .github/workflows
