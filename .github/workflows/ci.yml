name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor, what users build with, and the early warning. Releases in between add
        # nothing: what fails on a later one fails on the floor too.
        toolchain: [stable, beta, msrv]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The MSRV leg follows `rust-version` in Cargo.toml, so an MSRV bump is a one-line change.
      # RUSTUP_TOOLCHAIN goes to the environment as well as to the install action: installing a
      # toolchain does not select it, and `rust-toolchain.toml` outranks the rustup default the
      # action sets, while the variable outranks the file.
      - name: Resolve toolchain
        id: toolchain
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          if [ "$TOOLCHAIN" = "msrv" ]; then
            TOOLCHAIN="$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)"
            test -n "$TOOLCHAIN"
          fi
          echo "toolchain=$TOOLCHAIN" >> "$GITHUB_OUTPUT"
          echo "RUSTUP_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: matrix.toolchain == 'stable'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Advisory, not a gate: surfaces a lint added by the next clippy release six weeks
      # before it turns the build red.
      - name: cargo clippy (beta, advisory)
        if: matrix.toolchain == 'beta'
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo check (no default features)
        run: cargo check --workspace --no-default-features

      - name: cargo check (all features)
        run: cargo check --workspace --all-targets --all-features

      # --no-fail-fast: a failing target must not hide failures in the targets behind it;
      # the log then lists every red test, not just the first binary's.
      - name: cargo test (handler-stub only, no live broker)
        run: cargo test --workspace --all-features --no-fail-fast

      # The crate-root missing_docs deny covers item docs; this gate catches what rustc
      # cannot: broken intra-doc links and redundant targets only rustdoc resolves.
      - name: cargo doc
        if: matrix.toolchain == 'stable'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  features:
    name: Each feature alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2.85.8
        with:
          tool: cargo-hack

      # --no-dev-deps: a dev-dependency in scope masks a missing feature gate in the library.
      # It also rewrites the manifests in place, which is why the lock file is not asserted here.
      - name: cargo hack check (each feature)
        run: cargo hack check --workspace --each-feature --no-dev-deps

  minimal-versions:
    name: Minimal versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install nightly (resolver only)
        uses: dtolnay/rust-toolchain@nightly

      # The floor, for the build step below. Read from the manifest so an MSRV bump stays the
      # one-line change it is in the matrix above.
      - name: Resolve the floor toolchain
        id: floor
        run: |
          FLOOR="$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)"
          test -n "$FLOOR"
          echo "toolchain=$FLOOR" >> "$GITHUB_OUTPUT"

      - name: Install the floor toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.floor.outputs.toolchain }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The full flag rather than -Z direct-minimal-versions: the narrow one leaves the assembled
      # graph unverified, and that is what a user builds. It costs the pinning list below.
      - name: Resolve minimal versions
        run: cargo +nightly update -Z minimal-versions

      # No pinning step: every manifest in the graph declares a floor its code actually compiles
      # against. Add one here, naming the manifest at fault, if a dependency ever understates its
      # own bound.
      #
      # Minimum dependencies on the minimum compiler: the worst case a user can assemble.
      # Resolution above needs nightly, so only this step drops to the floor. --locked holds the
      # resolution that step produced, which a re-resolve would otherwise undo.
      - name: Build and test against minimal versions
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.floor.outputs.toolchain }}
        run: |
          cargo check --locked --workspace --all-targets --all-features
          cargo test --locked --workspace --all-features --no-fail-fast

  templates:
    name: Templates (render + compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: ruststream-nats

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ruststream-nats

      - name: Install cargo-generate
        uses: taiki-e/install-action@v2.85.8
        with:
          tool: cargo-generate

      # Template-contract drift check: render each scaffold and compile it, so a broker API change
      # that breaks a template fails here, not a user's first `cargo build`. No --locked: a fresh
      # scaffold has no lock file, which is the situation a user starts from.
      # Only this crate is redirected to the branch. The core resolves from crates.io, exactly as it
      # does in a user's first build, so this job also proves the scaffold's core requirement can be
      # satisfied by a published version. The pin still has to name the line this branch is on: a
      # requirement the patched crate does not satisfy is dropped as unused, and the render then
      # resolves the published crate instead and stops checking this branch at all.
      - name: Render and check templates
        working-directory: ruststream-nats
        env:
          NATS_PATH: ${{ github.workspace }}/ruststream-nats/crates/ruststream-nats
        run: |
          for tpl in nats nats-js; do
            name="smoke-$tpl"
            cargo generate --path "templates/$tpl" --name "$name" --destination "$RUNNER_TEMP" --vcs none
            # The scaffold manifests are checked in as `Cargo.toml.liquid` so that cargo's
            # git-source package discovery never parses their placeholder name. Assert that
            # cargo-generate did drop the suffix, otherwise the append below would quietly write a
            # manifest of its own.
            test -f "$RUNNER_TEMP/$name/Cargo.toml"
            {
              echo ""
              echo "[patch.crates-io]"
              echo "ruststream-nats = { path = \"$NATS_PATH\" }"
            } >> "$RUNNER_TEMP/$name/Cargo.toml"
            cargo check --manifest-path "$RUNNER_TEMP/$name/Cargo.toml"
          done

  broker-integration:
    name: Broker integration (NATS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Start NATS with JetStream
        run: |
          docker run -d --name nats \
            -p 127.0.0.1:4222:4222 \
            -p 127.0.0.1:8222:8222 \
            nats:2-alpine -js -m 8222

      - name: Wait for NATS + JetStream
        timeout-minutes: 1
        run: |
          timeout 30 bash -c 'until docker logs nats 2>&1 | grep -q "Server is ready"; do sleep 0.5; done'
          docker logs nats

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run NATS integration tests
        env:
          NATS_TEST_URL: nats://127.0.0.1:4222
        run: >-
          cargo test -p ruststream-nats
          --test integration_nats
          --test integration_nats_batch
          -- --test-threads=1

      - name: Run NATS conformance suite
        env:
          NATS_TEST_URL: nats://127.0.0.1:4222
        run: cargo test -p ruststream-nats --features testing --test conformance_nats -- --test-threads=1

      - name: Cleanup
        if: always()
        run: docker rm -f nats

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.85.8
        with:
          tool: cargo-deny

      # Dependency-graph gate: RustSec advisories, license allow-list, duplicate
      # versions, and registry sources, per the checked-in deny.toml. Not path-
      # gated: advisories arrive over time, not only with manifest changes.
      - name: cargo deny
        run: cargo deny check

      # No cache: there is no uv.lock anymore (uvx resolves the tools on the fly).
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: codespell
        run: uvx codespell

      - name: zizmor
        run: uvx zizmor .github/workflows
