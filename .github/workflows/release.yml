name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check tag matches Cargo.toml and pyproject versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          TAG_VER="${TAG#v}"

          CARGO_VERSION=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')
          if [ "$TAG_VER" != "$CARGO_VERSION" ]; then
            echo "Tag '${TAG}' does not match Cargo.toml version '$CARGO_VERSION'"
            exit 1
          fi

          PY_VERSION=$(python -c "
          import tomllib
          with open('py/ruststream-nats-py/pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          if [ "$TAG_VER" != "$PY_VERSION" ]; then
            echo "Tag '${TAG}' does not match pyproject.toml version '$PY_VERSION'"
            exit 1
          fi

          echo "Version $TAG_VER verified (Cargo + pyproject match)"

  crates-io:
    name: Publish ruststream-nats to crates.io
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: ruststream-nats

      - uses: actions/checkout@v4
        with:
          repository: powersemmi/ruststream
          persist-credentials: false
          path: ruststream

      - uses: actions/checkout@v4
        with:
          repository: powersemmi/ruststream-py
          persist-credentials: false
          path: ruststream-py

      - name: Exchange OIDC token for crates.io token
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=crates-io")
          TOKEN=$(echo "$RESPONSE" | jq -r '.token')
          echo "CARGO_REGISTRY_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo publish ruststream-nats
        working-directory: ruststream-nats
        run: cargo publish -p ruststream-nats

  wheels:
    name: Wheels ${{ matrix.platform.runner }} ${{ matrix.platform.target }}
    needs: verify
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: aarch64
          - runner: macos-14
            target: aarch64
          - runner: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: ruststream-nats

      - uses: actions/checkout@v4
        with:
          repository: powersemmi/ruststream
          persist-credentials: false
          path: ruststream

      - uses: actions/checkout@v4
        with:
          repository: powersemmi/ruststream-py
          persist-credentials: false
          path: ruststream-py

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ruststream-nats
          target: ${{ matrix.platform.target }}
          manylinux: auto
          args: --release --out dist --manifest-path py/ruststream-nats-py/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: ruststream-nats/dist

  sdist:
    name: sdist
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: ruststream-nats

      - uses: actions/checkout@v4
        with:
          repository: powersemmi/ruststream
          persist-credentials: false
          path: ruststream

      - uses: actions/checkout@v4
        with:
          repository: powersemmi/ruststream-py
          persist-credentials: false
          path: ruststream-py

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ruststream-nats
          command: sdist
          args: --out dist --manifest-path py/ruststream-nats-py/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ruststream-nats/dist

  pypi:
    name: Publish ruststream-nats to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

      - name: Attach artifacts to release
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"

      - name: Generate release notes
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
