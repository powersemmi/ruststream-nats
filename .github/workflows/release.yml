name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check tag matches Cargo.toml and pyproject versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          TAG_VER="${TAG#v}"

          CARGO_VERSION=$(python -c "
          import tomllib
          with open('Cargo.toml', 'rb') as f:
              print(tomllib.load(f)['workspace']['package']['version'])
          ")
          if [ "$TAG_VER" != "$CARGO_VERSION" ]; then
            echo "Tag '${TAG}' does not match Cargo.toml version '$CARGO_VERSION'"
            exit 1
          fi

          PY_VERSION=$(python -c "
          import tomllib
          with open('py/ruststream-nats-py/pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          if [ "$TAG_VER" != "$PY_VERSION" ]; then
            echo "Tag '${TAG}' does not match pyproject.toml version '$PY_VERSION'"
            exit 1
          fi

          echo "Version $TAG_VER verified (Cargo + pyproject match)"

  crates-io:
    name: Publish ruststream-nats to crates.io
    needs: verify
    runs-on: ubuntu-latest
    environment: crates.io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: ruststream-nats

      - uses: actions/checkout@v4
        with:
          repository: powersemmi/ruststream
          persist-credentials: false
          path: ruststream

      - uses: actions/checkout@v4
        with:
          repository: powersemmi/ruststream-py
          persist-credentials: false
          path: ruststream-py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate to crates.io via trusted publishing
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: cargo publish ruststream-nats
        working-directory: ruststream-nats
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          # Skip publishing when this version is already on crates.io, so re-running a
          # release (or a partially-failed one) still succeeds.
          name=ruststream-nats
          version=$(cargo metadata --format-version 1 --no-deps \
            | jq -r --arg n "$name" '.packages[] | select(.name == $n) | .version')
          index="https://index.crates.io/${name:0:2}/${name:2:2}/${name}"
          if curl -fsSL "$index" 2>/dev/null | grep -qF "\"vers\":\"${version}\""; then
            echo "$name $version already on crates.io, skipping"
          else
            cargo publish -p "$name"
          fi

  wheels:
    name: Wheels ${{ matrix.platform.runner }} ${{ matrix.platform.target }}
    needs: verify
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: aarch64
          - runner: macos-14
            target: aarch64
          - runner: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: ruststream-nats

      - uses: actions/checkout@v4
        with:
          repository: powersemmi/ruststream
          persist-credentials: false
          path: ruststream

      - uses: actions/checkout@v4
        with:
          repository: powersemmi/ruststream-py
          persist-credentials: false
          path: ruststream-py

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ruststream-nats
          target: ${{ matrix.platform.target }}
          manylinux: auto
          args: --release --out dist --manifest-path py/ruststream-nats-py/Cargo.toml
        env:
          CFLAGS_aarch64_unknown_linux_gnu: "-D__ARM_ARCH=8"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: ruststream-nats/dist

  sdist:
    name: sdist
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: ruststream-nats

      - uses: actions/checkout@v4
        with:
          repository: powersemmi/ruststream
          persist-credentials: false
          path: ruststream

      - uses: actions/checkout@v4
        with:
          repository: powersemmi/ruststream-py
          persist-credentials: false
          path: ruststream-py

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ruststream-nats
          command: sdist
          args: --out dist --manifest-path py/ruststream-nats-py/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ruststream-nats/dist

  pypi:
    name: Publish ruststream-nats to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

      - name: Attach artifacts to release
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Generate release notes
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" -q .body)
          gh release edit "$TAG" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
