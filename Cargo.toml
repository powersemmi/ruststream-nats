[workspace]
resolver = "3"
members = ["crates/ruststream-nats"]
# `templates/` holds cargo-generate scaffolds (rendered by `cargo generate`, not built here): their
# sources carry `{{project-name}}` placeholders that are not valid Rust/TOML until rendered, so they
# must stay out of the workspace.
exclude = ["templates"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/powersemmi/ruststream-nats"
authors = ["RustStream contributors"]

[workspace.dependencies]
ruststream-nats = { path = "crates/ruststream-nats" }

ruststream = { version = ">=0.5.0, <0.6.0", default-features = false }

async-nats = "0.49"
bytes = "1"
futures = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
time = "0.3.49"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"
missing_docs = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_const_for_fn = "allow"
multiple_crate_versions = "allow"
redundant_pub_crate = "allow"
