[workspace]
resolver = "3"
members = [
    "crates/ruststream-nats",
    "py/ruststream-nats-py",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/powersemmi/ruststream-nats"
authors = ["RustStream contributors"]

[workspace.dependencies]
ruststream-nats = { path = "crates/ruststream-nats" }

# Cross-repo path deps. Sibling layout assumed: ruststream/ and ruststream-py/
# next to ruststream-nats/. Flip the path values to crates.io version ranges after
# ruststream 0.2 and ruststream-pyo3 0.1 are published.
ruststream = { version = ">=0.2.0, <0.3.0", path = "../ruststream", default-features = false }
ruststream-pyo3 = { version = ">=0.2.0, <0.3.0", path = "../ruststream-py/crates/ruststream-pyo3" }

async-nats = "0.46"
bytes = "1"
futures = "0.3"
pyo3 = { version = "0.28", features = ["abi3-py311"] }
pyo3-async-runtimes = { version = "0.28", features = ["tokio-runtime"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"
missing_docs = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_const_for_fn = "allow"
multiple_crate_versions = "allow"
redundant_pub_crate = "allow"
