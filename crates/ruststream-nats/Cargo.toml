[package]
name = "ruststream-nats"
description = "NATS / JetStream broker implementation for the RustStream messaging framework."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["nats", "messaging", "jetstream", "broker", "faststream"]
categories = ["asynchronous", "network-programming"]

[lints]
workspace = true

[features]
default = []
testing = ["ruststream/conformance", "ruststream/testing"]

[dev-dependencies]
# The conformance harness drives the testing-feature broker; macros + json power the runnable
# nats_* examples (the docs site embeds their snippets), and serde decodes their message types.
ruststream = { workspace = true, features = ["conformance", "testing", "macros", "json"] }
serde = { version = "1", features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

[dependencies]
ruststream = { workspace = true, default-features = false }
async-nats.workspace = true
bytes.workspace = true
futures.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

# The nats_* examples are the docs-site snippet sources; keep them runnable and snippet-checked here.
[[example]]
name = "nats_core"

[[example]]
name = "nats_jetstream"

[[example]]
name = "nats_request_reply"
