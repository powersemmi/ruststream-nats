[package]
name = "ruststream-nats"
description = "NATS / JetStream broker implementation for the RustStream messaging framework."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["nats", "messaging", "jetstream", "broker", "ruststream"]
categories = ["asynchronous", "network-programming"]

[lints]
workspace = true

[features]
default = []
# The broker's in-process mode: `TestApp::start` connects `NatsBroker` without a server. A service
# enables it in its dev-dependencies. The conformance harness is a broker-author tool and stays in
# this repo's dev-dependencies, not in the user-facing feature.
testing = ["ruststream/testing"]
# The protocol bindings this crate contributes to a generated AsyncAPI document. Additive: the
# hooks are gated on the core's own feature, and a binding body is a plain serde struct.
asyncapi = ["ruststream/asyncapi", "dep:serde"]

[dev-dependencies]
# The conformance harness drives the testing-feature broker; macros + json power the runnable
# nats_* examples (the docs site embeds their snippets), and serde decodes their message types.
ruststream = { workspace = true, features = ["conformance", "testing", "macros", "json", "asyncapi"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

[dependencies]
ruststream = { workspace = true, default-features = false }
async-nats.workspace = true
bytes.workspace = true
futures.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

# The nats_* examples are the docs-site snippet sources; keep them runnable and snippet-checked here.
[[example]]
name = "nats_core"

[[example]]
name = "nats_jetstream"

[[example]]
name = "nats_request_reply"

[[example]]
name = "nats_retry"

[package.metadata.docs.rs]
all-features = true

