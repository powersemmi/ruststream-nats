[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "ruststream-nats"
version = "0.2.1"
description = "NATS broker for the RustStream messaging framework (Python bindings)."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "RustStream contributors" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = ["ruststream>=0.2.0,<0.3.0"]

[project.urls]
Homepage = "https://github.com/powersemmi/ruststream-nats"
Repository = "https://github.com/powersemmi/ruststream-nats"

[tool.maturin]
python-source = "python"
module-name = "ruststream_nats._native"
features = ["pyo3/extension-module"]
strip = true
include = [{ path = "python/ruststream_nats/py.typed", format = "wheel" }]
