# The lanes of `workers(n, by_key)` are the framework's, and the core's translated guides call
# them партиции / 分区. On a page that also states NATS has no partition of its own, the
# framework's concept is qualified rather than renamed.
[[term]]
en = "lane"
en_match = "lanes?"
ru = "партиции воркеров"
ru_match = "партици\\w* воркеров"
zh = "工作分区"

